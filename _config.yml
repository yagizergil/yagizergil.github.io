# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: en

# Change to your timezone › https://zones.arilyn.cc
timezone: Europe/Istanbul

# jekyll-seo-tag settings
# ↓ --------------------------

title: Historical Tales # Ana başlık

tagline: Untold Stories from the Past # Alt başlık

description: >- # SEO açıklaması
  Explore dramatic historical narratives, forgotten women of history, and untold stories from the 1500s-1700s through classical art and compelling storytelling.

# Fill in the protocol & hostname for your site.
url: "https://yagizergil.github.io"

github:
  username: yagizergil

twitter:
  username: # Twitter varsa ekle, yoksa boş bırak

social:
  name: Yagiz Ergil
  email: # Email eklemek istersen
  links:
    - https://github.com/yagizergil
    - https://youtube.com/@yourchannelhandle # YouTube kanalını ekle
    # - https://twitter.com/username
    # - https://instagram.com/username

# Site Verification Settings (sonra ekleyeceğiz)
webmaster_verifications:
  google: # Google Search Console'dan alacağız
  bing: 
  alexa: 
  yandex: 
  baidu: 
  facebook: 

# Web Analytics Settings
analytics:
  google:
    id: # Google Analytics ekleyeceğiz sonra

# Prefer color scheme setting - Dark mode default
theme_mode: dark # Dark mode varsayılan

# the avatar on sidebar
avatar: # Profil resmi URL'i ekleyeceğiz

# The URL of the site-wide social preview image
social_preview_image: # Sosyal medya önizleme görseli

# boolean type, the global switch for TOC in posts.
toc: true

comments:
  provider: # Yorum sistemi istemiyorsan boş bırak

# Self-hosted static assets
assets:
  self_host:
    enabled: false

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ Bunların altını değiştirme ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
